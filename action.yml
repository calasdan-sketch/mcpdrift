name: mcpdrift
description: Fail the build when an MCP server's tools, descriptions or schemas drift from the committed lockfile, with severity-scored, readable findings.
author: calasdan-sketch
branding:
  icon: lock
  color: orange

inputs:
  lock:
    description: Path to the committed lockfile (from `mcpdrift snapshot`).
    required: true
  config:
    description: MCP config (.mcp.json style) used to launch the server. Give this or `from-file`.
    required: false
    default: ""
  from-file:
    description: Saved tools/list JSON to check instead of launching a server (nothing is executed).
    required: false
    default: ""
  server:
    description: Server name inside the config (defaults to the one recorded in the lock).
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the job (info, low, medium, high, critical, never).
    required: false
    default: info
  ignore:
    description: Newline-separated glob patterns of paths to ignore (e.g. server.version).
    required: false
    default: ""
  allowed-signers:
    description: OpenSSH allowed_signers file. When set, <lock>.sig must verify before checking.
    required: false
    default: ""
  identity:
    description: Signer identity required with allowed-signers (e.g. you@example.com).
    required: false
    default: ""
  timeout:
    description: Seconds per MCP request.
    required: false
    default: "20"
  python-version:
    description: Python used to run mcpdrift.
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: 0 no drift (or below fail-on), 1 drift, 2 usage/server error, 3 integrity/signature failure.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install mcpdrift (from this action's own pinned source, not a floating PyPI version)
      shell: bash
      run: python -m pip install --disable-pip-version-check -q "$GITHUB_ACTION_PATH"
    - name: Check MCP surface
      id: check
      shell: bash
      env:
        IN_LOCK: ${{ inputs.lock }}
        IN_CONFIG: ${{ inputs.config }}
        IN_FROM_FILE: ${{ inputs.from-file }}
        IN_SERVER: ${{ inputs.server }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_IGNORE: ${{ inputs.ignore }}
        IN_SIGNERS: ${{ inputs.allowed-signers }}
        IN_IDENTITY: ${{ inputs.identity }}
        IN_TIMEOUT: ${{ inputs.timeout }}
      run: |
        # Inputs arrive via env vars, never interpolated into the script,
        # so a crafted input cannot inject shell commands.
        args=(check --lock "$IN_LOCK" --fail-on "$IN_FAIL_ON" --timeout "$IN_TIMEOUT"
              --format github --markdown-out "$GITHUB_STEP_SUMMARY")
        [ -n "$IN_CONFIG" ] && args+=(--config "$IN_CONFIG")
        [ -n "$IN_FROM_FILE" ] && args+=(--from-file "$IN_FROM_FILE")
        [ -n "$IN_SERVER" ] && args+=(--server "$IN_SERVER")
        [ -n "$IN_SIGNERS" ] && args+=(--allowed-signers "$IN_SIGNERS" --identity "$IN_IDENTITY")
        while IFS= read -r pat; do
          pat="${pat#"${pat%%[![:space:]]*}"}"; pat="${pat%"${pat##*[![:space:]]}"}"
          [ -n "$pat" ] && args+=(--ignore "$pat")
        done <<< "$IN_IGNORE"
        set +e
        mcpdrift "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
